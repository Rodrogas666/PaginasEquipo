<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Gamer</title>
    <style>
        /* Estilos generales del cuerpo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal de la tarjeta */
        .profile-card {
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid #333;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* Cabecera */
        .profile-header h1 {
            margin: 0;
            color: #00ff88;
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .profile-header p {
            color: #aaaaaa;
            font-size: 0.9em;
            margin-top: 5px;
        }

        /* Secciones de contenido */
        .specs-section, .games-section {
            margin-top: 25px;
            text-align: left;
        }

        h2 {
            font-size: 1.2em;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 5px;
            margin-bottom: 15px;
            color: #eeeeee;
        }

        /* Listas y elementos */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            background-color: #333333;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            font-size: 0.95em;
        }

        /* Icono decorativo antes de cada elemento de la lista */
        li::before {
            content: "⚡";
            margin-right: 12px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-header">
            <h1>Setup Gamer</h1>
            <p>Estación de Batalla Principal</p>
        </div>
        
        <div class="specs-section">
            <h2>Hardware</h2>
            <ul>
                <li>Procesador: AMD Ryzen 5 4500</li>
                <li>Tarjeta Gráfica: NVIDIA GeForce RTX 3050</li>
                <li>Almacenamiento: SSD Externo NTFS</li>
            </ul>
        </div>

        <div class="games-section">
            <h2>Librería Activa</h2>
            <ul>
                <li>Paladins</li>
                <li>Fortnite</li>
            </ul>
        </div>
    </div>

</body>
</html>
